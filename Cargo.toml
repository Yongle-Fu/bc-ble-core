[package]
name = "bc-ble-core"
version = "0.1.0"
edition = "2024"
description = "Shared BLE core library for BrainCo Rust SDKs"
license = "MIT"
repository = "https://github.com/Yongle-Fu/bc-ble-core"

[features]
default = []

[dependencies]
btleplug = { git = "https://github.com/Yongle-Fu/btleplug", rev = "3ed87aabc4b37e0a56eb1a95edf7008422794051" }
uuid = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
lazy_static = "1"
log = "0.4"
anyhow = "1"
cfg-if = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.5.2"
objc2-core-bluetooth = { version = "0.2.2", features = ["CBPeripheral", "CBCentralManager", "CBPeer"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSString", "NSUUID", "NSObject"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Use the DeviceId type from the pinned btleplug backend for fallible parsing.
bluez-async = { git = "https://github.com/Yongle-Fu/bluez-async", rev = "16b2affa1a66da28d871e091c131e608698b42ef" }
